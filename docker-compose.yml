services:
  db:
    image: postgres:16-alpine
    container_name: alaik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: alaik
      POSTGRES_PASSWORD: alaik
      POSTGRES_DB: alaik
    ports:
      - "5442:5432"
    volumes:
      - alaik-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alaik"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  alaik-pgdata:
